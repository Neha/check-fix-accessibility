name: Check skill docs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Version and links
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check version and relative links
        run: python3 scripts/check-skill-docs.py
